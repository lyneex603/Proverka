name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q SimpleCheck.zip
      - run: mvn -B package
        working-directory: SimpleCheck
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleCheck
          path: SimpleCheck/target/SimpleCheck-1.0.0.jar
